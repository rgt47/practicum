name: Render and deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.57'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::dplyr
            any::ggplot2
            any::tibble
            any::tidyr
            any::broom
            any::survival
            any::palmerpenguins
            any::tidyverse
            any::patchwork
            any::naniar
            any::mice
            any::gt
            any::gtsummary
            any::janitor
            any::GGally
            any::survminer
            any::UpSetR
            any::DBI
            any::RSQLite
            any::dbplyr
            any::duckdb
            any::digest
            any::reticulate
            any::jsonlite
            any::rvest
            any::httr2
            any::haven
            any::usethis
            any::skimr

      # The in-house packages are not on CRAN. Install them best-effort so
      # that the call check below can verify calls against them; if the
      # install fails, the check reports them as unverifiable rather than
      # failing, and the deploy proceeds.
      - name: Install in-house packages (best effort)
        continue-on-error: true
        run: |
          Rscript -e 'install.packages("remotes")' \
            -e 'for (p in c("rgt47/zzlongplot", "rgt47/zztable1",
                            "rgt47/zzpower", "rgt47/zzrenvcheck",
                            "rgt47/zzobj2fig"))
                  try(remotes::install_github(p, upgrade = "never"))'

      # Guards against the book naming a function that does not exist. Every
      # pkg::fn() call in the prose is checked against the package's exports.
      # This is here because several such calls shipped undetected: they sat
      # in static code blocks the render never executes, so a clean render
      # said nothing about whether the code would run.
      - name: Check namespaced function calls
        run: Rscript tools/check-calls.R

      # Committed _freeze/ results are reused when a chapter is unchanged, so
      # a full R/Python execution is not normally required in CI. Python is
      # provisioned here only as a fallback for chapters that are re-executed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pandas numpy matplotlib statsmodels scikit-learn plotnine

      - name: Render book
        env:
          RETICULATE_PYTHON: python
        run: quarto render --to html

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./_book
          production-branch: main
          production-deploy: true
          deploy-message: 'GHA: ${{ github.event.head_commit.message }}'
          enable-pull-request-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
